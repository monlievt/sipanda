version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipanda_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sipanda_net
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: sipanda_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sipanda_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sipanda_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sipanda}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sipanda_root_pass_2026}
      MYSQL_USER: ${DB_USERNAME:-sipanda_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sipanda_pass_2026}
    volumes:
      - sipanda_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - sipanda_net

  redis:
    image: redis:alpine
    container_name: sipanda_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sipanda_redis_data:/data
    networks:
      - sipanda_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipanda_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    networks:
      - sipanda_net
    depends_on:
      - app
      - db
      - redis

  waha:
    image: devlikepro/waha
    container_name: sipanda_waha
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: "http://app/api/webhook/whatsapp"
      WHATSAPP_HOOK_EVENTS: "message"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: "admin"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_API_KEY:-sipanda_secret_waha_key_2026}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sipanda_waha_sessions:/app/.sessions
    networks:
      - sipanda_net

networks:
  sipanda_net:
    driver: bridge

volumes:
  sipanda_db_data:
    driver: local
  sipanda_redis_data:
    driver: local
  sipanda_waha_sessions:
    driver: local

